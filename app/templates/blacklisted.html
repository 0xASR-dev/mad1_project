{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Account Blacklisted</h4>
            </div>
            <div class="card-body text-center py-5">
                <p class="lead text-muted mb-4">
                    Your account has been blacklisted due to policy violations or administrative action.
                </p>
                <p class="text-muted mb-4">
                    You cannot access the dashboard or perform any actions. Please contact the administrator for more
                    information.
                </p>
                <div class="d-grid gap-2 col-8 mx-auto">
                    <a href="{{ url_for('main.logout') }}" class="btn btn-outline-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
