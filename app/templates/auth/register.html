{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-7 col-xl-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold text-center mb-3">Patient Registration</h2>
          <p class="text-muted text-center mb-4">Create your account to book appointments and manage your health records.</p>
          <form method="post">
            <div class="mb-3">
              <label class="form-label" for="name">Full Name</label>
              <input class="form-control form-control-lg" id="name" name="name" type="text" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" placeholder="Create a password" required>
            </div>
            <div class="form-check mt-4 mb-4">
              <input class="form-check-input" id="terms" name="terms" type="checkbox" required>
              <label class="form-check-label" for="terms">I agree to the HMS privacy policy.</label>
            </div>
            <button class="btn btn-success w-100 btn-lg" type="submit">Create Account</button>
          </form>
        </div>
        <div class="card-footer text-center bg-white py-3">
          <small class="text-muted">Already have an account? <a class="text-decoration-none" href="{{ url_for('main.login') }}">Sign in</a></small>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
