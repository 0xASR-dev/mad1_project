{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h2 class="fw-bold text-center mb-3">Login to HMS</h2>
        <!-- <p class="text-muted text-center mb-4">Sign in to manage appointments, review patient histories, and collaborate with your care team.</p> -->
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control form-control-lg" id="email" name="email" type="email" placeholder="your email"
              required>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label mb-0" for="password">Password</label>
              <!-- <a class="small text-decoration-none" href="#">Forgot password?</a> -->
            </div>
            <input class="form-control form-control-lg" id="password" name="password" type="password"
              placeholder="your password" required>
          </div>
          <!-- <div class="form-check mb-4">
              <input class="form-check-input" id="remember" name="remember" type="checkbox">
              <label class="form-check-label" for="remember">Keep me signed in</label>
            </div> -->
          <button class="btn btn-primary w-100 btn-lg" type="submit">Sign In</button>
        </form>
      </div>
      <div class="card-footer text-center bg-white py-3">
        <small class="text-muted">New to HMS? <a class="text-decoration-none"
            href="{{ url_for('main.register') }}">Create an account</a></small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
